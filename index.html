<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ===== Favicon ===== -->
    <link rel="icon" type="/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- ===== Viewport ===== -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== Primary Meta ===== -->
    <title>Academy | Online Private Tutoring for Students Worldwide</title>
    <meta
      name="description"
      content="a+ Academy provides one-to-one online tutoring in Mathematics, English, Sciences and exam preparation. Qualified tutors, personalised lesson plans, students worldwide."
    />
    <meta
      name="keywords"
      content="online tutoring, private tutor, maths tutor, English tutor, science tutor, exam preparation, WAEC, JAMB, IGCSE, SAT, 11+, online lessons"
    />
    <meta name="author" content="a+ Academy" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#001A4D" />

    <!-- ===== Canonical ===== -->
    <link rel="canonical" href="https://yourdomain.com/" />

    <!-- ===== Open Graph (Facebook, LinkedIn, WhatsApp, Slack) ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="a+ Academy" />
    <meta property="og:title" content="a+ Academy | Online Private Tutoring for Students Worldwide" />
    <meta
      property="og:description"
      content="One-to-one online tutoring in Maths, English, Sciences and exam prep. Qualified tutors, personalised plans, students worldwide."
    />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:image" content="https://yourdomain.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="a+ Academy — online private tutoring" />
    <meta property="og:locale" content="en_US" />

    <!-- ===== Twitter Card ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@yourhandle" />
    <meta name="twitter:creator" content="@yourhandle" />
    <meta name="twitter:title" content="a+ Academy | Online Private Tutoring" />
    <meta
      name="twitter:description"
      content="One-to-one online tutoring in Maths, English, Sciences and exam prep — for students anywhere in the world."
    />
    <meta name="twitter:image" content="https://yourdomain.com/og-image.png" />

    <!-- ===== Structured Data (JSON-LD) ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "a+ Academy",
        "url": "https://yourdomain.com",
        "logo": "https://yourdomain.com/logo.png",
        "description": "One-to-one online tutoring in Mathematics, English, Sciences and exam preparation for students worldwide.",
        "sameAs": [
          "https://www.facebook.com/yourpage",
          "https://www.instagram.com/yourhandle",
          "https://www.linkedin.com/company/yourpage"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "hello@yourdomain.com",
          "availableLanguage": ["English"]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
